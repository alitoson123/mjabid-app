# Codemagic configuration file for Capacitor iOS build
# For more info see: https://docs.codemagic.io/

workflows:
  capacitor-ios-workflow:
    name: Capacitor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mjabid.play
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # These variables must be added via Codemagic UI -> Environment variables (with Secure toggle ON)
        # APP_STORE_CONNECT_ISSUER_ID
        # APP_STORE_CONNECT_KEY_IDENTIFIER
        # APP_STORE_CONNECT_PRIVATE_KEY
        
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
        
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          
      - name: Sync Capacitor project (copy web assets and update plugins)
        script: |
          chmod +x node_modules/.bin/cap
          npx cap sync ios
          
      - name: Install Pods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.mjabid.play \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build IPA for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
          
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
