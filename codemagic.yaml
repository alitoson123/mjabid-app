# Codemagic configuration file for Capacitor iOS build
# For more info see: https://docs.codemagic.io/

workflows:
  capacitor-ios-workflow:
    name: Capacitor iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        
    triggering:
      events:
        - push
      branches:
        - main
        
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          
      - name: Sync Capacitor project (copy web assets and update plugins)
        script: |
          npx cap sync ios
          
      - name: Install Pods
        script: |
          cd ios/App
          pod install
          
      - name: Build IPA for App Store / TestFlight
        script: |
          # Note: For publishing to the App Store, you will need to set up iOS Code Signing
          # in the Codemagic UI settings for this application.
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
          
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.ipa
