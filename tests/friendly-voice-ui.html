<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; connect-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:"><title>اختبار واجهة الصوت — محاكاة محلية</title>
<link rel="stylesheet" href="../www/game-core.css"><link rel="stylesheet" href="../www/ui-baloot.css"><link rel="stylesheet" href="../www/ui-table-realism.css"><link rel="stylesheet" href="../www/ui-friendly-voice.css">
<style>body{font-family:Arial,sans-serif;background:#112b23}#frame{background:#0b2a22}#onl,#blGame{position:absolute;inset:0}h1{text-align:center;font-size:20px;color:#f2d49b;padding-top:55px}.fixture-note{color:white;text-align:center;padding:15px;font-size:14px}.fixture-table{position:absolute;inset:21% 9% 32%;border:5px solid #b49a65;background:#143e35;border-radius:24px}#me2{position:absolute;bottom:0;left:0;right:0}#oHand{display:flex;justify-content:center;height:120px;align-items:center}#oHand img{width:55px;height:78px;object-fit:contain;margin-inline:-8px}.blHand img{width:56px;height:78px}.blHand{display:flex;justify-content:center;bottom:85px}.blHand img+img{margin-inline-start:-14px}</style></head><body><main id="frame"></main>
<script>
window.MJ_FRIENDLY_VOICE_CONFIG={enabled:true,endpoint:'http://127.0.0.1:8793',allowLocalhost:true};window.qaCalls=[];window.qaEnabled=true;window.qaMicDenied=false;window.qaVoiceHandler=null;window.qaErrors=[];window.addEventListener('error',e=>qaErrors.push(e.message));
window.FB={user:{uid:'account-A',getIdToken:async()=> 'offline-fixture-only'}};
const native={addListener:async(name,fn)=>{qaVoiceHandler=fn;return {remove:async()=>{}}}};
native.getMicrophonePermission=async()=>({granted:!qaMicDenied});
native.cancel=async body=>qaCalls.push({name:'cancel',body});
for(const name of ['join','leave','setMicrophone','setPlayback','muteParticipant','renewToken'])native[name]=async body=>{qaCalls.push({name,body});if(name==='setMicrophone'&&body.enabled&&qaMicDenied)throw Object.assign(Error('denied'),{code:'E_MIC_PERMISSION'});};
window.Capacitor={isPluginAvailable:()=>true,Plugins:{FriendlyVoice:native}};
window.fetch=async(url,options)=>{const action=new URL(url).pathname.split('/').at(-1),body=JSON.parse(options.body);if(action==='settings')qaEnabled=body.enabled;const uid=FB.user.uid.at(-1),data={ok:true,enabled:qaEnabled,available:true,canManage:uid==='A',sessionId:'fixture-session',participants:['A','B','C','D','E','F'].map((id,i)=>({uid:i+1,playerId:qaGame==='sakka'?'account-'+id:'p-'+id,name:'لاعب الاختبار '+id,joined:true,blocked:false}))};if(['join','renew'].includes(action))Object.assign(data,{appId:'a'.repeat(32),channel:'fixture-voice-room',uid:uid.charCodeAt(0)-64,token:'fixture-only-not-agora',expiresAt:Date.now()+180000});return {ok:true,status:200,json:async()=>data};};
window.qaGame='majabeed';
window.qaSetup=function(game='majabeed',id='A'){
 window.MajabeedFriendlyVoice?.disconnect();qaGame=game;FB.user={uid:'account-'+id,getIdToken:async()=> 'offline-fixture-only'};
 const cards=['2S','3H','4D','5C','6S','7H','8D','9C','10S','JH'].map(c=>'<img alt="ورقة" src="../www/cards/'+c+'.png">').join('');
 document.getElementById('frame').innerHTML='<section id="'+(game==='sakka'?'blGame':'onl')+'"><h1>جلسة ودية · اختبار الصوت</h1><p class="fixture-note">محاكاة واجهة فقط؛ لا يوجد اتصال صوتي حقيقي</p><div class="fixture-table"></div>'+(game==='sakka'?'<div class="blHand">'+cards+'</div><div class="blActions"><button class="blBtn" data-bl="claim">قيدها</button><button class="blBtn" data-bl="projects">مشروع</button><button class="blBtn" data-bl="sawa">سوا</button><button class="blBtn blChatButton" data-bl="chat">💬</button></div>':'<div id="me2"><div id="oThumb"><div id="oHand">'+cards+'</div><div id="oActions"><span id="oChatWrap"><button id="oChatBtn">💬</button></span><button id="oThrow" class="abtn">رمي</button><button id="oReactBtn">التعبيرات</button></div></div></div>')+'</section>';
 if(game==='sakka')MajabeedFriendlyVoice.syncSakka({room:'TEST1234',mode:'friendly',me:id.charCodeAt(0)-65,seats:['A','B','C','D'].map(id=>({uid:'account-'+id,name:'اختبار '+id}))});
 else MajabeedFriendlyVoice.syncMajabeed({room:'voice-fixture',active:true,you:'p-'+id,seats:['p-A','p-B','p-C','p-D','p-E','p-F'],stateReady:true});
};
window.qaMeasure=function(){const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height};},mic=document.querySelector('#mjFriendlyVoice button'),chat=document.querySelector(qaGame==='sakka'?'[data-bl="chat"]':'#oChatBtn'),cards=document.querySelector(qaGame==='sakka'?'.blHand':'#oHand');const a=rect(mic),b=rect(chat),c=rect(cards);return {mic:a,chat:b,cards:c,overlapChat:a.x<b.right&&a.right>b.x&&a.y<b.bottom&&a.bottom>b.y,overlapCards:a.x<c.right&&a.right>c.x&&a.y<c.bottom&&a.bottom>c.y,overflow:document.documentElement.scrollWidth>innerWidth,errors:qaErrors,state:MajabeedFriendlyVoice.getController().snapshot(),panel:document.querySelector('#mjVoicePanel')?rect(document.querySelector('.mjVoiceCard')):null};};
</script><script src="../www/ui-friendly-voice.js"></script><script>qaSetup();</script></body></html>
