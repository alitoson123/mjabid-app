# Codemagic configuration file for Capacitor iOS build
# For more info see: https://docs.codemagic.io/

workflows:
  capacitor-ios-workflow:
    name: Majabeed Sandbox TestFlight (manual only)
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "mjabid app"
      
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mjabid.play
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # These variables must be added via Codemagic UI -> Environment variables (with Secure toggle ON)
        # APP_STORE_CONNECT_ISSUER_ID
        # APP_STORE_CONNECT_KEY_IDENTIFIER
        # APP_STORE_CONNECT_PRIVATE_KEY
        
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Require verified Sandbox configuration
        script: |
          node scripts/select-environment.cjs sandbox

      - name: Install npm dependencies
        script: |
          npm ci
          
      - name: Verify purchase UI and assets
        script: |
          npm run test:purchases
          node scripts/verify-purchases-build.cjs

      - name: Sync Capacitor project (copy web assets and update plugins)
        script: |
          chmod +x node_modules/.bin/cap
          npx cap sync ios
          node scripts/verify-purchases-build.cjs --copied
          
      - name: Set up build number
        script: |
          cd ios/App
          agvtool new-version -all $((49 + ${BUILD_NUMBER:-0}))
          
      - name: Install Pods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles
          
      - name: Build IPA for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
          
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
